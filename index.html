<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Imagen</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  #contenedor {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #imagen-fondo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(35px) brightness(0.6);
    transform: scale(1.15); /* evita que se noten los bordes borrosos */
  }
  #imagen {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* la imagen se ve COMPLETA, sin recortar nada */
    display: block;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: #000; /* Cambia este color si quieres otro fondo antes de revelar la imagen */
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 1.3rem;
    cursor: pointer;
    text-align: center;
    padding: 20px;
    z-index: 10;
    transition: opacity 0.4s ease;
  }
  #overlay.oculto {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="contenedor">
    <img id="imagen-fondo" src="flor_amarilla.png" alt="" aria-hidden="true" />
    <img id="imagen" src="flor_amarilla.png" alt="" />
  </div>

  <div id="overlay">Toca para continuar 🔊</div>

  <audio id="audio" src="golden.mp3" loop></audio>

  <script>
    const overlay = document.getElementById("overlay");
    const audio = document.getElementById("audio");

    overlay.addEventListener("click", () => {
      audio.play().catch((err) => console.warn("No se pudo reproducir el audio:", err));

      // Intenta pantalla completa real del navegador (opcional, mejora la experiencia)
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }

      overlay.classList.add("oculto");
    });
  </script>
</body>
</html>
